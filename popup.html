<!DOCTYPE html>
<html>
<head>
  <title>Mail Classifier</title>
  <style>
    body {
      width: 300px;
      font-family: Arial, sans-serif;
      padding: 12px;
      background: #f8fafc;
      color: #111827;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 8px;
    }
    p {
      margin-top: 0;
      line-height: 1.45;
      font-size: 12px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font-weight: 600;
    }
    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }
    textarea {
      width: 100%;
      min-height: 90px;
      resize: vertical;
      margin-top: 10px;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 12px;
      box-sizing: border-box;
    }
    #status {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      min-height: 56px;
      background: white;
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .result-action-required {
      background-color: #fee2e2;
      border-color: #ef4444;
    }
    .result-no-action-required {
      background-color: #dcfce7;
      border-color: #22c55e;
    }
    .result-error {
      background-color: #f3f4f6;
      border-color: #9ca3af;
    }
  </style>
</head>
<body>
  <h3>Mail Classifier</h3>
  <p>Classify whether the email is High Priority or Low Priority using your local Ollama decision model.</p>
  <button id="triggerButton">Classify Email</button>
  <textarea id="manualEmailText" placeholder="Paste the email text here if Gmail extraction fails."></textarea>
  <div id="status">Awaiting input...</div>

  <script src="popup.js"></script>
</body>
</html>
